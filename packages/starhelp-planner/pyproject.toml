[project]
name = "starhelp-planner"
version = "0.4.0"
description = "Pure local StarHelp template matching and planning core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
producer-signature = ["cryptography>=43,<47"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
