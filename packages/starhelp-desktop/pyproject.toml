[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "starhelp-desktop"
version = "0.1.0"
description = "Windows desktop and local account component for StarHelp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.10.3,<6.11"]
package = ["pyinstaller==6.22.3"]
crypto = ["cryptography>=43,<47"]
ocr = ["rapidocr>=3.10,<4", "onnxruntime>=1.20,<2"]

[project.scripts]
starhelp-desktop = "starhelp_desktop.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/starhelp_desktop"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
