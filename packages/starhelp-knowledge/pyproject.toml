[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "starhelp-knowledge"
version = "0.2.0"
description = "Public-only, versioned knowledge backend for StarHelp"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=43,<47"]

[project.scripts]
starhelp-knowledge = "starhelp_knowledge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/starhelp_knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
